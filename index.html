<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Auto Rally</title><style>body{margin:0;background:#182033;color:white;font:16px Arial;text-align:center}canvas{display:block;margin:10px auto;background:#37985b;max-width:96vw;touch-action:none;border-radius:12px}button{padding:12px 20px;margin:5px;border:0;border-radius:8px;background:#f5a742;font-weight:bold}#controls{display:flex;justify-content:center;gap:30px}</style><h2>🛺 Auto Rally</h2><div>Lap <span id="lap">1</span>/3 · Time <span id="time">0.0</span>s · Coins <span id="coins">0</span> · Best <span id="best">—</span></div><canvas id="game" width="360" height="560"></canvas><div id="controls"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button><button id="mute">Sound: Off</button><button id="start">Start / Restart</button></div><p>Use arrow keys or touch controls. Avoid obstacles and collect coins.</p><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let car=180,obs=[],coins=[],lap=1,score=0,start=0,running=false,muted=true,last=0,best=+(localStorage.best||0),keys={};document.querySelector('#best').textContent=best?best.toFixed(1)+'s':'—';function spawn(){if(Math.random()<.025)obs.push({x:90+Math.random()*180,y:-30});if(Math.random()<.018)coins.push({x:90+Math.random()*180,y:-20})}function draw(){x.clearRect(0,0,360,560);x.fillStyle='#37985b';x.fillRect(0,0,360,560);x.fillStyle='#343b4b';x.fillRect(70,0,220,560);x.strokeStyle='white';x.lineWidth=5;x.setLineDash([22,20]);x.beginPath();x.moveTo(180,0);x.lineTo(180,560);x.stroke();x.setLineDash([]);x.fillStyle='#f4b400';x.fillRect(car-20,460,40,65);x.fillStyle='#222';x.fillRect(car-13,468,26,18);x.fillStyle='#ff4545';obs.forEach(o=>x.fillRect(o.x-15,o.y,30,30));x.fillStyle='#ffe45c';coins.forEach(o=>{x.beginPath();x.arc(o.x,o.y,9,0,7);x.fill()});x.fillStyle='white';x.font='14px Arial';x.fillText('Avoid red blocks · Collect coins',8,20)}function loop(t){if(!running){draw();return}let dt=Math.min(.04,(t-last)/1000||0);last=t;if(keys.left)car-=190*dt;if(keys.right)car+=190*dt;car=Math.max(90,Math.min(270,car));spawn();obs.forEach(o=>o.y+=190*dt);coins.forEach(o=>o.y+=170*dt);obs=obs.filter(o=>o.y<590);coins=coins.filter(o=>o.y<590);if(obs.some(o=>Math.abs(o.x-car)<28&&o.y>445&&o.y<530)){running=false;alert('Crash! Press Start to try again.');draw();return}coins=coins.filter(o=>{if(Math.abs(o.x-car)<25&&o.y>445&&o.y<535){score++;document.querySelector('#coins').textContent=score;return false}return true});let elapsed=(t-start)/1000;document.querySelector('#time').textContent=elapsed.toFixed(1);if(elapsed>lap*12){lap++;document.querySelector('#lap').textContent=Math.min(lap,3);if(lap>3){running=false;let final=elapsed;if(!best||final<best){best=final;localStorage.best=best;document.querySelector('#best').textContent=best.toFixed(1)+'s'}alert(`Race finished in ${final.toFixed(1)} seconds! Coins: ${score}`);return}}draw();requestAnimationFrame(loop)}function startGame(){car=180;obs=[];coins=[];lap=1;score=0;start=performance.now();last=start;running=true;['lap','coins','time'].forEach(id=>document.querySelector('#'+id).textContent=id==='lap'?1:0);requestAnimationFrame(loop)}document.querySelector('#start').onclick=startGame;document.querySelector('#mute').onclick=e=>{muted=!muted;e.target.textContent='Sound: '+(muted?'Off':'On (visual demo)')};onkeydown=e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true};onkeyup=e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false};for(let [id,key] of [['left','left'],['right','right']]){let b=document.querySelector('#'+id);b.onpointerdown=()=>keys[key]=true;b.onpointerup=b.onpointerleave=()=>keys[key]=false}draw();</script></html>
